openapi: 3.1.0
info:
  title: Kuberoute AI API
  version: 1.0.0
servers:
  - url: https://api.kuberoute.ai/v1
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /api/v1/clusters:
    get:
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: List of clusters
    post:
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                provider: { type: string }
                region: { type: string }
      responses:
        '201':
          description: Cluster created
  /api/v1/clusters/{id}:
    get:
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cluster details
    delete:
      security: [ { bearerAuth: [] } ]
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
