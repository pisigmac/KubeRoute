apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberoute-agent
  namespace: kuberoute
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberoute-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberoute-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberoute-agent
subjects:
  - kind: ServiceAccount
    name: kuberoute-agent
    namespace: kuberoute
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kuberoute-agent
  namespace: kuberoute
spec:
  selector:
    matchLabels:
      app: kuberoute-agent
  template:
    metadata:
      labels:
        app: kuberoute-agent
    spec:
      serviceAccountName: kuberoute-agent
      containers:
        - name: agent
          image: kuberoute/agent:v1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: KUBEROUTE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kuberoute-config
                  key: cluster-id
            - name: KUBEROUTE_API_ENDPOINT
              value: "grpc.kuberoute.ai:443"
            - name: KUBEROUTE_METRICS_INTERVAL
              value: "15s"
            - name: KUBEROUTE_INSECURE
              value: "false"
          volumeMounts:
            - name: buffer
              mountPath: /var/lib/kuberoute
      volumes:
        - name: buffer
          emptyDir: {}
