apiVersion: v1
kind: Namespace
metadata:
  name: kuberoute-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: kuberoute-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: kuberoute/orchestrator:v1.0.0
          ports:
            - containerPort: 8080
            - containerPort: 50051
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuberoute-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuberoute-secrets
                  key: jwt-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: kuberoute-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
        - name: ai-engine
          image: kuberoute/ai-engine:v1.0.0
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: kuberoute-prod
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: kuberoute-prod
spec:
  selector:
    app: ai-engine
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-engine-hpa
  namespace: kuberoute-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
